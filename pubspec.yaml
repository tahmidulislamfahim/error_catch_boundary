name: error_catch_boundary
description: "A React-inspired error boundary package for Flutter that catches subtree build errors, prevents UI crashes, logs exceptions, and displays localized fallback UI."
version: 1.0.1
repository: https://github.com/tahmidulislamfahim/error_catch_boundary
homepage: https://github.com/tahmidulislamfahim/error_catch_boundary
topics:
  - error-handling
  - error-boundary
  - ui
  - fallback
  - robustness

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
